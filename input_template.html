<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频分段 · 输入模板</title>
<style>
  :root {
    --bg: #1a1a20;
    --card: #232330;
    --card2: #2a2a3a;
    --border: #3a3a4e;
    --text: #e8e8f0;
    --muted: #9a9ab0;
    --accent: #ff9292;
    --accent-dim: rgba(255, 146, 146, .12);
    --ok: #6fd98c;
    --err: #ff6b6b;
    --mono: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding: 24px 16px 60px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; line-height: 1.7; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; color: var(--accent); margin-bottom: 12px; letter-spacing: .5px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    background: var(--card2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; font-size: 14px; outline: none;
    font-family: var(--mono);
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  input.invalid { border-color: var(--err); }
  #url { width: 100%; }
  .row { display: flex; gap: 3px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .tsnum { width: 46px; text-align: center; padding: 8px 2px; font-size: 14px; }
  .tsnum::-webkit-outer-spin-button, .tsnum::-webkit-inner-spin-button { -webkit-appearance: none; }
  .unit { color: var(--muted); font-size: 11px; margin-right: 6px; user-select: none; }
  .lbl { color: var(--muted); font-size: 12px; margin-right: 2px; user-select: none; }
  .sep { color: var(--muted); font-size: 14px; margin: 0 8px; user-select: none; }
  .btn {
    background: var(--accent); color: #1a1a20; border: none; border-radius: 9px;
    padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: filter .15s; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.del {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    font-size: 15px; padding: 7px 10px; line-height: 1; margin-left: 6px;
  }
  .btn.del:hover { color: var(--err); border-color: var(--err); }
  .preview {
    background: #14141c; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.8; color: #c8c8e0; white-space: pre-wrap; word-break: break-all;
    max-height: 260px; overflow-y: auto;
  }
  .preview .hl { color: var(--accent); }
  .preview .dim { color: var(--muted); }
  .copied { color: var(--ok); font-size: 12px; margin-left: 8px; }
  .tip { color: var(--muted); font-size: 12px; line-height: 1.8; margin-top: 10px; }
  .tip b { color: var(--accent); font-weight: 600; }
  .rowhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .rowhead h2 { margin: 0; }
  .errline { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 18px; }
  .chip { display: inline-block; background: var(--accent-dim); color: var(--accent);
    border-radius: 6px; padding: 2px 8px; font-size: 11px; margin: 0 4px 4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 视频分段 · 输入模板（B站 / YouTube）</h1>
  <div class="sub">填好下面两项 → 底部实时生成命令 → 一键复制发给我。时间拆成 <b>时/分/秒</b> 三个框，秒支持小数（如 <span class="chip">12.5</span>）。</div>

  <div class="card">
    <h2>① 视频链接</h2>
    <label>支持 B 站（URL 或 BV 号）与 YouTube（watch/shorts/youtu.be）</label>
    <input id="url" type="text" placeholder="https://www.bilibili.com/video/BV1xxxxxxxx 或 https://www.youtube.com/watch?v=xxxx" value="">
  </div>

  <div class="card">
    <div class="rowhead">
      <h2>② 分段时间戳</h2>
      <button class="btn" id="addBtn">＋ 添加分段</button>
    </div>
    <div id="rows"></div>
    <div class="errline" id="err"></div>
  </div>

  <div class="card">
    <h2>③ 生成的命令（复制发我）</h2>
    <div class="preview" id="cmd"></div>
    <div style="margin-top:10px; display:flex; align-items:center;">
      <button class="btn" id="copyBtn">📋 复制命令</button>
      <span class="copied" id="copied"></span>
    </div>
    <div class="tip">
      <b>不用页面也行</b>——直接打字发我，格式：分段 <b>0:00-12:34, 12:34-25:00, 25:00-40:12</b>（每段用逗号分隔，可留空档）。
    </div>
  </div>
</div>

<script>
let n = 0;

function addRow() {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `
    <span class="lbl">开始</span>
    <input class="tsnum s h" placeholder="时">
    <span class="unit">时</span>
    <input class="tsnum s m" placeholder="分">
    <span class="unit">分</span>
    <input class="tsnum s s2" placeholder="秒">
    <span class="unit">秒</span>
    <span class="sep">→</span>
    <span class="lbl">结束</span>
    <input class="tsnum e h" placeholder="时">
    <span class="unit">时</span>
    <input class="tsnum e m" placeholder="分">
    <span class="unit">分</span>
    <input class="tsnum e s2" placeholder="秒">
    <span class="unit">秒</span>
    <button class="btn del" title="删除此段">✕</button>`;
  div.querySelector(".del").onclick = () => { div.remove(); refresh(); };
  div.querySelectorAll(".tsnum").forEach(inp => {
    inp.oninput = () => { validateTs(inp); refresh(); };
  });
  document.getElementById("rows").appendChild(div);
  n++;
  refresh();
}

// 单框校验: 时=整数, 分/秒=0-59(秒可带小数)
function validateTs(inp) {
  const v = inp.value.trim();
  const cls = inp.classList;
  const isS = cls.contains("s2");
  const isH = cls.contains("h");
  let ok = v === "";
  if (!ok) {
    if (isH) ok = /^\d+$/.test(v);
    else if (isS) ok = /^\d{1,2}(\.\d{1,2})?$/.test(v) && parseFloat(v) < 60;
    else ok = /^\d{1,2}$/.test(v) && parseInt(v, 10) < 60;
  }
  inp.classList.toggle("invalid", !ok);
  return ok;
}

// 读取一端的三个框 -> {h,m,s,empty}
function readTs(r, prefix) {
  const h = r.querySelector("." + prefix + ".h").value.trim();
  const m = r.querySelector("." + prefix + ".m").value.trim();
  const s = r.querySelector("." + prefix + ".s2").value.trim();
  return { h, m, s, empty: !h && !m && !s };
}

function tsToSec(o) {
  return (parseInt(o.h || 0) * 3600) + (parseInt(o.m || 0) * 60) + parseFloat(o.s || 0);
}

function tsToStr(o) {
  const h = parseInt(o.h || 0), m = parseInt(o.m || 0), s = parseFloat(o.s || 0);
  const ss = Number.isInteger(s) ? String(Math.floor(s)).padStart(2, "0") : s.toFixed(2);
  return h > 0
    ? h + ":" + String(m).padStart(2, "0") + ":" + ss
    : String(m).padStart(2, "0") + ":" + ss;
}

function refresh() {
  const err = document.getElementById("err");
  const url = document.getElementById("url").value.trim();
  const rows = [...document.querySelectorAll(".row")];
  const cuts = [];
  const problems = [];
  let prevEnd = null;

  rows.forEach((r, i) => {
    const sObj = readTs(r, "s"), eObj = readTs(r, "e");
    if (sObj.empty && eObj.empty) return;
    if (sObj.empty || eObj.empty) {
      problems.push(`第 ${i + 1} 段：开始/结束必须都填`);
      return;
    }
    // 校验范围 (空值在 tsToSec 按 0 处理, 单框不合法由 validateTs 标红)
    let bad = false;
    ["h", "m", "s2"].forEach(k => {
      const el = r.querySelector(".s." + k);
      if (!validateTs(el)) { bad = true; }
      if (!validateTs(r.querySelector(".e." + k))) { bad = true; }
    });
    if (bad) { problems.push(`第 ${i + 1} 段时间不合法（分/秒 0-59，秒可小数）`); return; }
    const sSec = tsToSec(sObj), eSec = tsToSec(eObj);
    if (eSec <= sSec) {
      problems.push(`第 ${i + 1} 段：结束必须晚于开始`);
      return;
    }
    if (prevEnd !== null && sSec < prevEnd) {
      problems.push(`第 ${i + 1} 段与上一段时间重叠`);
      return;
    }
    prevEnd = eSec;
    cuts.push(tsToStr(sObj) + "-" + tsToStr(eObj));
  });
  err.textContent = problems.join("；");

  const cutsStr = cuts.join(", ");
  const urlOk = /bilibili\.com\/video\/|^BV[0-9A-Za-z]{10}$|youtube\.com\/(watch\?v=|shorts\/|embed\/)|youtu\.be\//.test(url);
  const ready = urlOk && cuts.length > 0 && problems.length === 0;

  const cmd = document.getElementById("cmd");
  if (!url) {
    cmd.innerHTML = `<span class="dim">// 等待输入视频链接...</span>`;
  } else if (!urlOk) {
    cmd.innerHTML = `<span class="dim">// 链接格式不对：应为 bilibili.com/video/... 、BV号、youtube.com/watch 或 youtu.be 链接</span>`;
  } else if (!cuts.length) {
    cmd.innerHTML = `<span class="dim">// 等待添加分段（点击上方"＋ 添加分段"）</span>`;
  } else {
    cmd.innerHTML = [
      `<span class="hl">分段参数：</span><span>${cutsStr}</span>`,
      ``,
      `<span class="hl">完整命令：</span>`,
      `python bili_split.py split \\`,
      `  --url "<span>${url}</span>" \\`,
      `  --cuts "<span>${cutsStr}</span>" \\`,
      `  --model "models/faster-whisper-small" \\`,
      `  --out ./output`,
      `</span>`
    ].join("\n");
  }
  cmd.dataset.raw = ready
    ? `python bili_split.py split --url "${url}" --cuts "${cutsStr}" --model "models/faster-whisper-small" --out ./output`
    : cutsStr ? `分段参数：${cutsStr}` : "";
}

document.getElementById("addBtn").onclick = () => addRow();
document.getElementById("url").oninput = refresh;
document.getElementById("copyBtn").onclick = async () => {
  const raw = document.getElementById("cmd").dataset.raw;
  const c = document.getElementById("copied");
  if (!raw) { c.textContent = "先填好链接和分段"; setTimeout(() => c.textContent = "", 2000); return; }
  try {
    await navigator.clipboard.writeText(raw);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = raw; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  c.textContent = "已复制 ✓ 直接粘贴发我";
  setTimeout(() => c.textContent = "", 2500);
};

// 默认给 3 行示例
addRow();
addRow();
addRow();
</script>
</body>
</html>
